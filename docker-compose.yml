# ============================================
# GoWizzYou — Docker Compose (DEV)
# Hot reload, volumes montes, debug
# ============================================

services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:17-alpine
    container_name: gowizzyou-db
    environment:
      POSTGRES_DB: gowizzyou
      POSTGRES_USER: gowizzyou
      POSTGRES_PASSWORD: gowizzyou_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gowizzyou"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- NestJS API ---
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: deps
    container_name: gowizzyou-api
    command: npx nest start --watch
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://gowizzyou:gowizzyou_dev@postgres:5432/gowizzyou?schema=public
      - API_PORT=3001
      - API_CORS_ORIGIN=http://localhost:3000
      - THROTTLE_TTL=60
      - THROTTLE_LIMIT=100
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- Next.js Web ---
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: deps
    container_name: gowizzyou-web
    command: npx next dev --port 3000
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/tsconfig.json:/app/tsconfig.json
      - ./apps/web/postcss.config.mjs:/app/postcss.config.mjs
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
